<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeStep 차량 디스플레이</title>
<meta name="description" content="SafeStep 차량용 앱을 웹에서 직접 눌러 보며 조작하는 시연 페이지">
<meta name="theme-color" content="#e5e6e9">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
@font-face{font-family:"Pretendard Variable";src:url("fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-display:swap}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#e5e6e9;color:#eeede9;font-family:"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;letter-spacing:-.02em;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;letter-spacing:inherit}
:focus-visible{outline:2px solid #ff9d2e;outline-offset:2px}
.stagewrap{flex:1;min-height:0;display:grid;place-items:center}
/* 1em = 시안 기준 1px (960×540) */
#scr{position:relative;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9));background:#e5e6e9;overflow:hidden;color:#17181b}
.stagewrap:fullscreen{background:#0b0b0c;padding:0}.stagewrap:fullscreen #scr{width:min(100vw,calc(100vh*16/9));border-radius:0;box-shadow:none}
#scr img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .28s;pointer-events:none;user-select:none}
#scr img.bg.show{opacity:1}
.hs{position:absolute;border-radius:16em;transition:background .12s,transform .12s,box-shadow .2s}
.hs.sq{border-radius:14em}
.hs:hover{background:rgba(23,24,27,.05)}
.hs:active{background:rgba(23,24,27,.16);transform:scale(.975)}
#scr.hint .hs{box-shadow:0 0 0 2em rgba(255,157,46,.9)}
.hs.ring{box-shadow:0 0 0 3em rgba(200,40,30,.55);animation:rp 1s infinite}
@keyframes rp{50%{box-shadow:0 0 0 7em rgba(200,40,30,.15)}}
.ov{position:absolute;pointer-events:none}
.tog{background:#e3e4e8;border-radius:20em;box-shadow:inset 2em 2em 5em rgba(148,153,166,.45),inset -2em -2em 5em rgba(255,255,255,.95)}
.tog::after{content:"";position:absolute;left:5em;top:5em;width:20em;height:20em;border-radius:50%;background:#b3b6be}
.chk{border-radius:50%;background:#17734f;display:grid;place-items:center;box-shadow:0 0 0 3em #e9eaed}
.chk svg{width:60%}
.patch{background:#e8e9ec;font-weight:700;display:flex;align-items:center;white-space:nowrap}
#sim{position:absolute;left:50%;bottom:16em;transform:translateX(-50%);display:none;align-items:center;gap:10em;background:rgba(23,24,27,.86);color:#fff;border-radius:99em;padding:9em 18em;white-space:nowrap;pointer-events:none}
#sim span{font-size:12.5em;font-weight:550}
#sim i{width:8em;height:8em;border-radius:50%;background:#ff9d2e;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#sim.show{display:flex}
#toast{position:absolute;left:50%;top:70em;transform:translate(-50%,-10em);background:#17181b;color:#fff;border-radius:16em;padding:12em 20em;opacity:0;transition:.25s;pointer-events:none;max-width:80%;text-align:center}
#toast span{font-size:13.5em;font-weight:600;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}
.bar{flex:none;height:56px;display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid rgba(255,255,255,.1);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar .t{font-size:12px;color:#8d8d93;margin-right:4px}
.bar button{font-size:13.5px;padding:8px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.22)}
.bar button:hover{border-color:rgba(255,255,255,.55)}
.bar .hz{background:#ff9d2e;border-color:#ff9d2e;color:#0b0b0c;font-weight:700}
.bar .rd{background:#c8281e;border-color:#c8281e;font-weight:700}
.bar .rd[hidden]{display:none}
.seg{display:flex;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}
.seg button{border:0;padding:6px 13px;color:#8d8d93}
.seg button[aria-pressed="true"]{background:#eeede9;color:#0b0b0c;font-weight:650}
.sp{margin-left:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stagewrap">
  <div id="scr" aria-label="SafeStep 차량 디스플레이">
    <div id="layer"></div>
    <div id="sim"><i></i><span id="simT"></span></div>
    <div id="toast" role="status"><span id="toastT"></span></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), scr=$("scr"), layer=$("layer");
const pad=n=>String(n).padStart(2,"0");
const CK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let curList=[],cur=1,ev=0,park=true,chk={evac:false,tri:false},ring119=false,autoT=null;
/* 화면 이미지 미리 올려 두기 */
const bg={};
for(let k=1;k<=18;k++){const im=new Image();im.className="bg";im.alt="";im.src="img/nav"+pad(k)+".webp";scr.insertBefore(im,layer);bg[k]=im}
/* 자동으로 넘어가는 화면(휴대폰에서 진행되는 단계) */
const AUTO={7:"운전자가 휴대폰 알림을 여는 중",8:"휴대폰으로 현장 사진을 찍는 중",9:"휴대폰에서 보험 접수 내용을 확인하는 중",10:"휴대폰에서 가족에게 알리는 중",17:"휴대폰에서 가족에게 알리는 중",16:"사고 뒤 배터리를 지켜보는 중"};
const nextOf=n=>({7:8,8:9,9:ev?17:10,10:11,17:16,16:18})[n];
/* 누를 수 있는 곳: [x,y,w,h] 는 960×540 기준 */
const HS={
 1:[{r:[30,120,530,250],fn:()=>impact(),l:"충격 발생",sq:1},{r:[770,322,157,100],fn:()=>{ev=ev?0:1;draw();toast("차종 모듈: "+(ev?"전기차 (고전압 배터리)":"내연기관"))},l:"차종 모듈 바꾸기",sq:1},{r:[866,445,56,34],fn:()=>{park=!park;toast("주차 중 충격 알림을 "+(park?"켰어요":"껐어요"));draw()},l:"주차 중 충격 알림"}],
 2:[{r:[492,335,228,62],fn:()=>go(ev?12:3),l:"예, 사고가 났어요"},{r:[735,335,177,62],fn:()=>{go(1);toast("오감지로 기록했어요. 다시 보호 모드로 돌아가요")},l:"아니요, 오감지예요"}],
 3:[{r:[711,364,90,50],fn:()=>go(4),l:"상세 보기"},{r:[811,364,116,50],fn:()=>go(5),l:"다음"}],
 4:[{r:[678,396,106,50],fn:()=>go(3),l:"돌아가기"},{r:[794,396,133,50],fn:()=>go(5),l:"다음"},{r:[36,78,45,26],fn:()=>go(3),l:"외관"},{r:[130,478,470,30],fn:()=>toast("이 시안에는 범퍼 빔 상세만 준비돼 있어요"),l:"다른 부품"}],
 5:[{r:[374,442,223,56],fn:()=>voice(),l:"안내 다시 듣기"},{r:[608,442,305,56],fn:()=>go(6),l:"폰으로 계속 진행"},{r:[34,352,300,46],fn:()=>tick("evac"),l:"가드레일 밖으로 대피",sq:1},{r:[34,402,300,46],fn:()=>tick("tri"),l:"안전삼각대 설치",sq:1}],
 6:[{r:[72,309,229,61],fn:()=>go(7),l:"아니요, 모두 괜찮아요"},{r:[316,309,200,61],fn:()=>{ring119=true;draw();toast("119 연결을 눌러 주세요. 위치와 손상 추정 정보가 함께 전달돼요")},l:"예, 다친 사람이 있어요"},{r:[578,300,149,55],fn:()=>call119(7),l:"119 연결",k:"119"}],
 7:[{r:[228,322,105,48],fn:()=>toast("휴대폰으로 알림을 다시 보냈어요"),l:"알림 다시 보내기"}],
 11:[{r:[72,416,162,54],fn:()=>toast("사고 리포트는 휴대폰 앱에서 볼 수 있어요"),l:"리포트 보기"},{r:[247,416,185,54],fn:()=>go(1),l:"닫기"}],
 12:[{r:[711,388,90,50],fn:()=>go(13),l:"상세 보기"},{r:[811,388,116,50],fn:()=>go(14),l:"다음"}],
 13:[{r:[678,396,105,50],fn:()=>go(12),l:"돌아가기"},{r:[793,396,134,50],fn:()=>go(14),l:"다음"},{r:[36,78,45,26],fn:()=>go(12),l:"외관"},{r:[130,478,500,30],fn:()=>toast("이 시안에는 배터리팩 상세만 준비돼 있어요"),l:"다른 부품"}],
 14:[{r:[34,198,260,48],fn:()=>go(15),l:"배터리 이상 상황 보기",sq:1},{r:[373,442,222,56],fn:()=>voice(),l:"안내 다시 듣기"},{r:[608,442,305,56],fn:()=>go(6),l:"폰으로 계속 진행"},{r:[34,352,260,46],fn:()=>tick("evac"),l:"가드레일 밖으로 대피",sq:1},{r:[34,402,260,46],fn:()=>tick("tri"),l:"안전삼각대 설치",sq:1}],
 15:[{r:[72,322,240,66],fn:()=>call119(16),l:"119 연결"},{r:[327,322,201,66],fn:()=>{go(16);toast("대피를 확인했어요. 배터리는 계속 지켜볼게요")},l:"대피했어요"}],
 18:[{r:[72,416,162,54],fn:()=>toast("사고 리포트는 휴대폰 앱에서 볼 수 있어요"),l:"리포트 보기"},{r:[247,416,185,54],fn:()=>go(1),l:"닫기"}]
};
function toast(m){$("toastT").textContent=m;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),2600)}
function voice(){toast("🔊 “동승자와 함께 가드레일 밖으로 먼저 대피하세요. 그다음 안전삼각대를 설치하세요.”")}
function tick(k){chk[k]=!chk[k];draw()}
function call119(after){toast("119에 연결하는 중이에요. 위치와 손상 추정 정보를 함께 보냈어요 (시연)");ring119=false;draw();clearTimeout(autoT);autoT=setTimeout(()=>go(after),2600)}
function home(){chk={evac:false,tri:false};ring119=false;go(1)}
function impact(){chk={evac:false,tri:false};ring119=false;go(2)}
function go(n){cur=n;clearTimeout(autoT);draw();if(AUTO[n])autoT=setTimeout(()=>go(nextOf(n)),4200)}
function box(r){return `left:${r[0]}em;top:${r[1]}em;width:${r[2]}em;height:${r[3]}em`}
function draw(){
  for(const k in bg)bg[k].classList.toggle("show",+k===cur);
  let h="";
  if(cur===1){if(!park)h+=`<div class="ov tog" style="${box([868,447,52,30])}"></div>`;if(ev)h+=`<div class="ov patch" style="left:785em;top:391em;width:62em;height:19em"><span style="font-size:13.5em">전기차</span></div>`}
  if(cur===5||cur===14){if(chk.evac)h+=`<div class="ov chk" style="${box([45,364,23,23])}">${CK}</div>`;if(chk.tri)h+=`<div class="ov chk" style="${box([45,414,23,23])}">${CK}</div>`}
  const list=(HS[cur]||[]).concat(cur===1?[]:[{r:[30,10,115,46],fn:()=>home(),l:"처음으로",sq:1}]);
  for(const s of list)h+=`<button type="button" class="hs${s.sq?" sq":""}${s.k==="119"&&ring119?" ring":""}" style="${box(s.r)}" aria-label="${s.l}" data-i="${list.indexOf(s)}"></button>`;
  curList=list;
  layer.innerHTML=h;
  $("sim").classList.toggle("show",!!AUTO[cur]);if(AUTO[cur])$("simT").textContent=AUTO[cur];
}
function fit(){scr.style.fontSize=(scr.clientWidth/960)+"px"}
scr.addEventListener("click",e=>{
  const b=e.target.closest(".hs");
  if(b){curList[+b.dataset.i].fn();return}
  if(AUTO[cur]){go(nextOf(cur));return}
  scr.classList.add("hint");setTimeout(()=>scr.classList.remove("hint"),700);   /* 누를 수 있는 곳 잠깐 표시 */
});
new ResizeObserver(fit).observe(scr);window.addEventListener("resize",fit);
fit();draw();
if(location.hash.startsWith("#s=")){const[a,b]=location.hash.slice(3).split(",");ev=+(b||0);cur=+a;if(location.hash.includes("x")){chk.evac=true;park=false;ring119=true}draw();scr.classList.add("hint")}
</script>
</body>
</html>
